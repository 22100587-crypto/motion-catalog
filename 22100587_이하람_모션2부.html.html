<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모션 카탈로그 2부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 수업 과제 노트 — 차분한 카탈로그, 데모가 주인공
IDEA: 견본첩(swatch book). 카드 한 장 = 움직임 견본 하나 + 조절 다이얼
PICTURE: 각 카드의 무대(stage)가 그림. 상단은 번호 칩 목록
COLOUR and TYPE: 따뜻한 종이색 바탕, 흰 카드, 무대는 각자의 색. Noto Sans KR + Inter
LAYOUT: 760px 한 단, 무대 아래 슬라이더 2열, 명세 문장 + 복사
*/
:root{color-scheme:light dark;--bg:light-dark(#f4f2ee,#111214);--card:light-dark(#fff,#1a1b1e);--ink:light-dark(#17171a,#eeece8);--mut:light-dark(#7d7b75,#96948f);--line:light-dark(#e6e3dc,#2b2c30);--chip:light-dark(#fff,#202125);--acc:#e0573a;--blue:#4a63e7}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:800px;margin:auto;padding:10px max(4vw,16px);display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.top b{font-weight:700}.top span{color:var(--mut)}
.wrap{max-width:800px;margin:auto;padding:0 max(4vw,16px) 80px}
.hero{padding:48px 0 28px}
.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em;font-weight:900;text-wrap:balance}
.hero p{margin:0 0 6px;color:var(--mut);max-width:60ch}
.hero p strong{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chips a{font:500 13px/1 Inter,sans-serif;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink);text-decoration:none;min-width:38px;text-align:center}
.chips a:hover,.chips a:focus-visible{border-color:var(--ink);outline:none}
h2.cat{font-size:19px;margin:44px 0 12px;font-weight:900;letter-spacing:-.01em}
h2.cat small{font:600 13px Inter,sans-serif;color:var(--acc);margin-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px}
.card header{display:flex;align-items:baseline;gap:10px;margin:2px 2px 12px}
.card .no{font:500 12px Inter,sans-serif;color:var(--mut)}
.card h3{margin:0;font-size:16px;font-weight:700;flex:1}
.card .hint{font-size:12px;color:var(--mut);white-space:nowrap}
.stage{position:relative;height:340px;border-radius:12px;overflow:hidden;background:#f1efe9;color:#17171a;user-select:none;-webkit-user-select:none;touch-action:manipulation;isolation:isolate}
.stage.dk{background:#141519;color:#f3f1ec}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sc>.tall{position:relative}
.sc .view{position:sticky;top:0;height:340px;overflow:hidden}
.tip{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;opacity:.6;pointer-events:none;z-index:5}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;padding:14px 4px 4px}
.ctl label{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 8px;font-size:13px;color:var(--mut)}
.ctl label output{font:500 12px Inter,"Noto Sans KR",sans-serif;color:var(--ink);white-space:nowrap}
.ctl input[type=range]{grid-column:1/-1;width:100%;height:28px;margin:0;accent-color:var(--acc);cursor:pointer}
.spec{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:10px;font-size:13px;line-height:1.55}
.spec p{margin:0;flex:1}
.spec p b{font-weight:700;color:var(--acc)}
.btns{display:flex;gap:6px;flex:none}
.btn{font:500 12px "Noto Sans KR",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:0 10px;min-height:32px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--ink);outline:none}
.toTop{position:fixed;right:16px;bottom:16px;z-index:30;font:600 13px "Noto Sans KR";background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 14px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.08)}
footer{color:var(--mut);font-size:13px;text-align:center;padding:30px 0}
@media(max-width:600px){.ctl{grid-template-columns:minmax(0,1fr)}.stage{height:300px}.sc .view{height:300px}.card{padding:12px}.top span{display:none}.spec{flex-direction:column}}
</style>
</head>
<body>
<div class="top"><div class="in"><b>모션 카탈로그 · 2부</b><span>각 카드의 슬라이더로 값을 바꿔 보세요</span></div></div>
<main class="wrap">
<section class="hero">
<h1>모션 46가지, 값을 돌려 보는 견본첩</h1>
<p>각 무대를 직접 만져 보고, 아래 슬라이더로 <strong>속도 · 거리 · 세기</strong>를 바꾸면 결과가 바로 달라집니다.</p>
<p>슬라이더 아래의 <strong>명세 문장</strong>은 지금 값 그대로 갱신됩니다. 복사해서 AI에 넣고 같은 움직임이 나오는지 비교해 보세요.</p>
<nav class="chips" id="chips" aria-label="모션 번호"></nav>
</section>
<div id="list"></div>
<footer>스마트 인터랙션 디자인 · 모션 카탈로그 2부 (52–97) 개인 과제</footer>
</main>
<a class="toTop" href="#">↑ 목록</a>
<script>
{
const D=[];const def=o=>D.push(o);
const CATS={K:'글자가 움직인다',L:'형태가 바뀐다',M:'그려지고 자란다',N:'무게가 있다',O:'빛과 재질',P:'공간을 움직인다',Q:'화면이 바뀐다',R:'터지고 보상한다',S:'질감과 스타일'};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>1-Math.pow(1-t,3),easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const h=(tag,cls,html,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};
const backOut=(s)=>t=>{const c=1.70158*s,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const fmtNum=(v,step)=>{const d=step<1?Math.min(3,String(step).split('.')[1]?.length||1):0;return (+v).toFixed(d)};
const RT=[];
function makeApi(R){
  return {
    frame(fn){R.frames.push(fn)},
    on(el,ev,fn,opt){el.addEventListener(ev,fn,opt);R.clean.push(()=>el.removeEventListener(ev,fn,opt))},
    later(fn,ms){const id=setTimeout(fn,ms);R.clean.push(()=>clearTimeout(id));return id},
    clean(fn){R.clean.push(fn)},
    pt(e,el){const r=(el||R.stage).getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}},
    scroll(mult=4,tipText='아래로 스크롤해 보세요 ↓'){
      const sc=h('div','sc',null,R.stage),tall=h('div','tall',null,sc);tall.style.height=(mult*100)+'%';
      const view=h('div','view',null,tall);if(tipText)h('div','tip',tipText,view);
      return{sc,view,p:()=>{const m=sc.scrollHeight-sc.clientHeight;return m>0?clamp(sc.scrollTop/m,0,1):0}};
    },
    canvas(parent){
      parent=parent||R.stage;const cv=h('canvas',null,null,parent),ctx=cv.getContext('2d');const o={cv,ctx,W:1,H:1,dpr:1};
      const fit=()=>{const r=parent.getBoundingClientRect();o.dpr=Math.min(2,window.devicePixelRatio||1);o.W=Math.max(1,r.width);o.H=Math.max(1,r.height);cv.width=Math.round(o.W*o.dpr);cv.height=Math.round(o.H*o.dpr);ctx.setTransform(o.dpr,0,0,o.dpr,0,0);o.onfit&&o.onfit()};
      fit();const ro=new ResizeObserver(fit);ro.observe(parent);R.clean.push(()=>ro.disconnect());return o;
    }
  };
}
function mount(R){
  R.clean.forEach(f=>{try{f()}catch(e){}});R.clean=[];R.frames=[];R.stage.innerHTML='';
  R.stage.className='stage'+(R.d.dark?' dk':'');
  if(R.d.bg)R.stage.style.background=R.d.bg;
  try{R.d.mount(R.stage,R.P,makeApi(R))}catch(err){console.error('demo '+R.d.n,err);R.stage.innerHTML='<div class="tip">이 데모를 불러오지 못했어요</div>'}
}
function specHTML(R){
  let s=R.d.spec(R.P);
  return s.replace(/\{([^}]+)\}/g,'<b>$1</b>');
}
function build(){
  const list=document.getElementById('list'),chips=document.getElementById('chips');let cat='';
  chips.innerHTML=D.map(d=>`<a href="#m${d.n}">${d.n}</a>`).join('');
  for(const d of D){
    if(d.cat!==cat){cat=d.cat;h('h2','cat',`<small>${cat}</small>${CATS[cat]}`,list)}
    const card=h('article','card',null,list);card.id='m'+d.n;
    card.innerHTML=`<header><span class="no">${d.n}</span><h3>${d.title}</h3><span class="hint">${d.hint}</span></header><div class="stage"></div><div class="ctl"></div>`;
    const R={d,card,stage:card.querySelector('.stage'),P:{},frames:[],clean:[],vis:false};
    const ctl=card.querySelector('.ctl');
    const lab=(p,v)=>p[7]&&p[7].L?p[7].L[Math.round(v)]:fmtNum(v,p[4])+(p[6]||'');
    let tmr;
    d.params.forEach(p=>{R.P[p[0]]=p[5];
      const l=h('label',null,`<span>${p[1]}</span><output></output><input type="range" min="${p[2]}" max="${p[3]}" step="${p[4]}" value="${p[5]}" aria-label="${p[1]}">`,ctl);
      const inp=l.querySelector('input'),out=l.querySelector('output');out.textContent=lab(p,p[5]);
      inp.addEventListener('input',()=>{R.P[p[0]]=+inp.value;out.textContent=lab(p,+inp.value);sp.innerHTML=specHTML(R);
        if(p[7]&&p[7].r){clearTimeout(tmr);tmr=setTimeout(()=>mount(R),160)} R.onParam&&R.onParam(p[0])});
    });
    const spec=h('div','spec',`<p></p><div class="btns"><button class="btn" data-a="copy">명세 복사</button><button class="btn" data-a="reset" title="값과 무대를 처음으로">↺ 처음</button></div>`,ctl);
    const sp=spec.querySelector('p');sp.innerHTML=specHTML(R);
    spec.addEventListener('click',async e=>{const a=e.target.dataset.a;if(!a)return;
      if(a==='copy'){const t=d.spec(R.P).replace(/[{}]/g,'');try{await navigator.clipboard.writeText(t);e.target.textContent='복사됨'}catch(_){const r=document.createRange();r.selectNodeContents(sp);const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent='선택됨 · ⌘C'}setTimeout(()=>e.target.textContent='명세 복사',1400)}
      if(a==='reset'){d.params.forEach(p=>{R.P[p[0]]=p[5]});ctl.querySelectorAll('label').forEach((l,i)=>{const p=d.params[i];l.querySelector('input').value=p[5];l.querySelector('output').textContent=lab(p,p[5])});sp.innerHTML=specHTML(R);mount(R)}
    });
    RT.push(R);mount(R);
  }
  const io=new IntersectionObserver(es=>es.forEach(en=>{const R=RT.find(r=>r.card===en.target);if(R)R.vis=en.isIntersecting}),{rootMargin:'100px'});
  RT.forEach(R=>io.observe(R.card));
  let last=performance.now();
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;const s=t/1000;
    for(const R of RT){if(!R.vis)continue;for(const f of R.frames){try{f(s,dt)}catch(err){console.error('frame '+R.d.n,err);R.frames=[]}}}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
}
/* ───────── K 글자가 움직인다 ───────── */
def({n:52,cat:'K',title:'한 자씩 조립',hint:'스크롤해 보기',
params:[['dist','흩어진 거리',40,400,10,180,'px'],['rot','최대 회전',0,180,5,90,'°'],['stag','글자 사이 시차',0,0.9,0.05,0.5,''],['size','글자 크기',24,80,2,52,'px']],
spec:P=>`스크롤하는 동안 문장의 글자들이 최대 {${P.dist}px} 떨어진 곳에서 {${P.rot}°}까지 돌아간 채로 출발해, 앞 글자부터 시차 {${P.stag}}만큼 늦게 차례로 제자리에 맞춰진다. 글자 크기 {${P.size}px}.`,
mount(st,P,api){const s=api.scroll(4);const v=s.view;v.style.cssText+='display:grid;place-items:center';
  const line=h('div',null,null,v);line.style.cssText='font-weight:900;letter-spacing:-.02em;white-space:nowrap';
  const txt='움직임은 문장이 된다';const L=[...txt].map(c=>{const e=h('span',null,c===' '?'&nbsp;':c,line);e.style.display='inline-block';const a=rnd(0,TAU);return{e,dx:Math.cos(a),dy:Math.sin(a),r:rnd(-1,1),k:rnd(.6,1)}});
  api.frame(()=>{const p=s.p(),n=L.length,sg=P.stag;line.style.fontSize=P.size+'px';
    L.forEach((o,i)=>{const t=clamp((p*1.15-i/n*sg)/(1-sg+1e-3),0,1),e=1-ease(t);o.e.style.transform=`translate(${o.dx*P.dist*o.k*e}px,${o.dy*P.dist*o.k*e}px) rotate(${o.r*P.rot*e}deg)`;o.e.style.opacity=.15+.85*(1-e)})})}});

def({n:53,cat:'K',title:'한 단어만 바뀌는 문장',hint:'잠시 지켜보기',bg:'#faf8f4',
params:[['hold','한 단어가 머무는 시간',0.6,5,0.1,2.2,'초'],['dur','바뀌는 시간',100,1200,20,520,'ms'],['dy','오르내리는 거리',0,60,2,22,'px'],['blur','바뀔 때 흐림',0,14,1,5,'px']],
spec:P=>`문장 "우리는 ___ 화면을 만듭니다"에서 가운데 단어만 {${P.hold}초}마다 바뀐다. 기존 단어는 위로 {${P.dy}px} 올라가며 {${P.blur}px} 흐려져 사라지고, 새 단어가 아래에서 올라온다. 전환 {${P.dur}ms}, 단어 폭도 같은 시간에 늘고 준다.`,
mount(st,P,api){st.style.display='grid';st.style.placeItems='center';
  const box=h('div',null,`<div style="font:600 11px Inter;letter-spacing:.2em;opacity:.45;margin-bottom:12px">STUDIO NOTE</div>`,st);box.style.textAlign='center';
  const line=h('div',null,null,box);line.style.cssText='font-size:clamp(22px,4.4vw,34px);font-weight:900;letter-spacing:-.02em;white-space:nowrap';
  line.innerHTML='우리는 <span class="w" style="display:inline-block;position:relative;vertical-align:bottom;height:1.3em;color:#e0573a"></span> 화면을 만듭니다';
  h('div',null,'작은 팀이 천천히, 오래 다듬습니다.',box).style.cssText='font-size:13px;opacity:.55;margin-top:10px';
  const W=['오래 쓰는','빠르게 읽히는','손에 붙는','조용한','다정한'];const slot=line.querySelector('.w');let i=0,acc=0;
  const meas=t=>{const m=h('span',null,t,line);m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap';const w=m.offsetWidth;m.remove();return w};
  const mk=t=>{const e=h('span',null,t,slot);e.style.cssText='position:absolute;left:0;top:0;white-space:nowrap';return e};
  let cur=mk(W[0]);slot.style.width=meas(W[0])+'px';
  api.frame((t,dt)=>{acc+=dt;if(acc<P.hold)return;acc=0;i=(i+1)%W.length;const d=P.dur+'ms',tr=`transform ${d} cubic-bezier(.3,.7,.2,1),opacity ${d},filter ${d}`;
    const old=cur;old.style.transition=tr;old.style.transform=`translateY(${-P.dy}px)`;old.style.opacity=0;old.style.filter=`blur(${P.blur}px)`;setTimeout(()=>old.remove(),P.dur+50);
    cur=mk(W[i]);cur.style.transform=`translateY(${P.dy}px)`;cur.style.opacity=0;cur.style.filter=`blur(${P.blur}px)`;void cur.offsetWidth;cur.style.transition=tr;cur.style.transform='none';cur.style.opacity=1;cur.style.filter='none';
    slot.style.transition=`width ${d} cubic-bezier(.3,.7,.2,1)`;slot.style.width=meas(W[i])+'px'})}});

def({n:54,cat:'K',title:'글자 늘어남·굵기 출렁임',hint:'커서를 좌우로',dark:true,
params:[['wmin','가장 가는 굵기',100,800,50,200,''],['wmax','가장 굵은 굵기',300,900,50,900,''],['spread','영향 범위',40,400,10,150,'px'],['stretch','가로 늘림',1,2,0.05,1.35,'배'],['follow','따라오는 속도',0.03,1,0.01,0.15,'']],
spec:P=>`커서가 "FLEX" 위를 좌우로 지나가면, 커서와 가까운 글자일수록 굵기가 {${P.wmin}}에서 {${P.wmax}}까지 굵어지고 가로로 {${P.stretch}배}까지 늘어난다. 영향 범위 {${P.spread}px}, 값은 매 프레임 {${P.follow}} 비율로 부드럽게 따라온다.`,
mount(st,P,api){st.style.display='grid';st.style.placeItems='center';
  const line=h('div',null,null,st);line.style.cssText='font:400 clamp(70px,15vw,130px)/1 Inter,sans-serif;white-space:nowrap;display:flex';
  h('div','tip','커서를 좌우로 움직여 보세요',st);
  const L=[...'FLEX'].map(c=>{const e=h('span',null,c,line);e.style.cssText='display:inline-block;transform-origin:center';return{e,w:P.wmin,s:1}});
  let mx=-999;api.on(st,'pointermove',e=>mx=api.pt(e).x);api.on(st,'pointerleave',()=>mx=-999);
  api.frame(()=>{const r=st.getBoundingClientRect();L.forEach(o=>{const b=o.e.getBoundingClientRect(),cx=b.left+b.width/2-r.left;const k=Math.exp(-((cx-mx)**2)/(2*P.spread*P.spread));
    o.w=lerp(o.w,lerp(P.wmin,Math.max(P.wmin,P.wmax),k),P.follow);o.s=lerp(o.s,lerp(1,P.stretch,k),P.follow);o.e.style.fontWeight=Math.round(o.w);o.e.style.transform=`scaleX(${o.s})`;o.e.style.margin=`0 ${(o.s-1)*24}px`})})}});

def({n:55,cat:'K',title:'틀을 넘치는 큰 글자',hint:'스크롤해 보기',
params:[['max','끝 크기',1,4,0.1,2.4,'배'],['tilt','틀 기울기',-15,15,1,-6,'°'],['spin','글자 회전',-30,30,1,8,'°']],
spec:P=>`스크롤에 따라 "가득" 글자가 {${(0.4).toFixed(1)}배}에서 {${P.max}배}까지 커지며 {${P.tilt}°} 기울어진 틀 밖으로 넘친다. 커지는 동안 글자도 {${P.spin}°} 돈다.`,

def({n:71,cat:'N',title:'찌그러지며 튕기는 공',hint:'화면 누르기',
params:[['g','중력',300,4000,50,1800,'px/초²'],['rest','탄성',0.2,0.95,0.01,0.7,''],['sq','찌그러짐',0,0.8,0.02,0.4,''],['size','공 지름',20,90,2,46,'px']],
spec:P=>`화면을 누르면 지름 {${P.size}px} 공이 그 위치 위쪽에서 떨어진다. 중력 {${P.g}px/초²}로 가속하고 바닥에 닿으면 속도의 {${Math.round(P.rest*100)}%}로 튀어 오른다. 닿는 순간 세기에 비례해 최대 {${P.sq}}만큼 납작해졌다가 위로 길쭉하게 늘어나며 회복한다.`,
mount(st,P,api){st.style.cursor='pointer';const fl=h('div',null,null,st);fl.style.cssText='position:absolute;left:0;right:0;bottom:0;height:56px;background:#d9d2c4;border-top:1px solid #bfb6a4';
  h('div',null,'화면을 누르면 공이 떨어집니다',st).style.cssText='position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.6';
  const ball=h('div',null,null,st),sh=h('div',null,null,st);ball.style.cssText='position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f08a6c,#d9502f 60%,#b33c20);transform-origin:50% 100%';
  sh.style.cssText='position:absolute;left:0;height:8px;border-radius:50%;background:rgba(0,0,0,.18)';
  let x=0,y=-1,vy=0,sq=0,sqv=0,init=0;api.on(st,'pointerdown',e=>{const p=api.pt(e);x=p.x;y=Math.min(p.y,60);vy=0});
  api.frame((t,dt)=>{const W=st.clientWidth,H=st.clientHeight,D=P.size,fy=H-56;if(!init){init=1;x=W/2;y=60}
    vy+=P.g*dt;y+=vy*dt;if(y+D>=fy&&vy>0){y=fy-D;const imp=Math.min(1,vy/1400);sqv-=imp*P.sq*30;vy=-vy*P.rest;if(Math.abs(vy)<40)vy=0}
    sqv+=(-sq*320-sqv*14)*dt;sq+=sqv*dt;const k=clamp(1+sq,.2,1.8);
    ball.style.width=ball.style.height=D+'px';ball.style.transform=`translate(${x-D/2}px,${y}px) scale(${1/Math.sqrt(k)},${k})`;
    const hgt=clamp((fy-y-D)/H,0,1);sh.style.width=D*(1-hgt*.6)+'px';sh.style.transform=`translate(${x-D*(1-hgt*.6)/2}px,${fy-4}px)`;sh.style.opacity=1-hgt})}});

def({n:72,cat:'N',title:'쏟아져 쌓이는 알갱이',hint:'꾹 누르고 있기',
params:[['rate','초당 알갱이',50,1500,10,420,'개'],['cell','알갱이 크기',2,6,1,3,'px',{r:1}],['spread','쏟는 폭',1,20,1,5,'칸'],['slide','옆으로 미끄러짐',0,1,0.05,0.9,'']],
spec:P=>`누르고 있는 동안 누른 자리에서 초당 {${P.rate}개}의 {${P.cell}px} 모래 알갱이가 폭 {${P.spread}칸}으로 쏟아진다. 알갱이는 아래가 비면 떨어지고, 막히면 {${Math.round(P.slide*100)}%} 확률로 비스듬히 미끄러져 기울어진 판 위에 산처럼 쌓인다. 판 끝에서 넘치면 아래로 흘러 떨어진다.`,
mount(st,P,api){const c=api.canvas(),C=P.cell;let gw,gh,G,col;st.style.cursor='crosshair';
  const rb=h('button','btn','↺',st);rb.style.cssText='position:absolute;right:10px;top:10px;z-index:6;width:34px;padding:0';h('div',null,'꾹 누르고 있어 보세요',st).style.cssText='position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;pointer-events:none';
  const init=()=>{gw=Math.ceil(c.W/C);gh=Math.ceil(c.H/C);G=new Uint8Array(gw*gh);col=new Uint8Array(gw*gh);
    const y0=Math.floor(gh*.62),x0=Math.floor(gw*.15),x1=Math.floor(gw*.85);for(let x=x0;x<=x1;x++){const y=Math.round(y0+(x-x0)*.12);for(let k=0;k<2;k++)G[(y+k)*gw+x]=2}
    for(const px of [x0+Math.floor((x1-x0)*.2),x0+Math.floor((x1-x0)*.8)]){const yt=Math.round(y0+(px-x0)*.12)+2;for(let y=yt;y<gh;y++)G[y*gw+px]=2}};
  init();c.onfit=init;api.on(rb,'click',e=>{e.stopPropagation();init()});
  let down=false,mx=0,my=0,acc=0;api.on(st,'pointerdown',e=>{if(e.target===rb)return;down=true;const p=api.pt(e);mx=p.x;my=p.y;st.setPointerCapture(e.pointerId)});api.on(st,'pointermove',e=>{const p=api.pt(e);mx=p.x;my=p.y});
  api.on(st,'pointerup',()=>down=false);api.on(st,'pointercancel',()=>down=false);
  const PAL=[[214,178,120],[196,156,98],[226,196,140],[180,140,90]];
  api.frame((t,dt)=>{if(down){acc+=P.rate*dt;while(acc>=1){acc--;const x=Math.floor(mx/C+rnd(-P.spread,P.spread)),y=Math.floor(my/C+rnd(-1,1));if(x>=0&&x<gw&&y>=0&&y<gh&&!G[y*gw+x]){G[y*gw+x]=1;col[y*gw+x]=Math.floor(Math.random()*4)}}}
    for(let y=gh-1;y>=0;y--){const dir=Math.random()<.5;for(let i=0;i<gw;i++){const x=dir?i:gw-1-i,k=y*gw+x;if(G[k]!==1)continue;if(y==gh-1){G[k]=0;continue}
      const b=k+gw;if(!G[b]){G[b]=1;col[b]=col[k];G[k]=0;continue}if(Math.random()>P.slide)continue;const s=Math.random()<.5?-1:1;
      for(const d of [s,-s]){const nx=x+d;if(nx<0||nx>=gw){G[k]=0;break}if(!G[b+d]){G[b+d]=1;col[b+d]=col[k];G[k]=0;break}}}}
    const g=c.ctx;g.clearRect(0,0,c.W,c.H);for(let k=0;k<G.length;k++){if(!G[k])continue;const x=k%gw,y=(k/gw)|0;if(G[k]==2){g.fillStyle='#6f5a44'}else{const q=PAL[col[k]];g.fillStyle=`rgb(${q})`}g.fillRect(x*C,y*C,C,C)}})}});

def({n:73,cat:'N',title:'부딪혀 무너짐',hint:'화면 누르기',
params:[['power','발사 속도',300,1600,20,900,'px/초'],['g','중력',500,3000,50,1600,'px/초²'],['rows','벽 높이',3,12,1,8,'줄',{r:1}],['spread','흩어짐',0,1,0.05,0.5,'']],
spec:P=>`화면을 누르면 왼쪽 대포가 {${P.power}px/초}로 포탄을 쏜다. 포탄이 {${P.rows}줄} 벽돌 벽에 맞으면 맞은 벽돌이 튕겨 나가고, 받침을 잃은 위쪽 벽돌들이 중력 {${P.g}px/초²}로 떨어지며 흩어짐 {${P.spread}}만큼 굴러 무너진다.`,
mount(st,P,api){const c=api.canvas();st.style.cursor='pointer';const rb=h('button','btn','↺',st);rb.style.cssText='position:absolute;right:10px;top:10px;z-index:6;width:34px;padding:0';
  h('div',null,'눌러 보세요',st).style.cssText='position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;pointer-events:none';
  let B=[],balls=[],fy;const bw=30,bh=14;
  const init=()=>{fy=c.H-50;B=[];const cols=5,x0=c.W*.6;for(let r=0;r<P.rows;r++)for(let i=0;i<cols+(r%2?0:0);i++){const x=x0+i*bw+(r%2?bw/2:0);B.push({x,y:fy-(r+1)*bh,vx:0,vy:0,a:0,w:0,dyn:false,rest:false})}balls=[]};init();c.onfit=init;
  api.on(rb,'click',e=>{e.stopPropagation();init()});
  api.on(st,'pointerdown',e=>{if(e.target===rb)return;const a=-0.12;balls.push({x:70,y:fy-30,vx:P.power*Math.cos(a),vy:P.power*Math.sin(a)})});
  const sup=b=>{if(b.y+bh>=fy-.5)return true;return B.some(o=>o!==b&&!o.dyn&&Math.abs(o.y-(b.y+bh))<2&&o.x<b.x+bw-4&&o.x+bw>b.x+4)};
  api.frame((t,dt)=>{const g=c.ctx;
    for(const ba of balls){ba.vy+=P.g*.35*dt;ba.x+=ba.vx*dt;ba.y+=ba.vy*dt;if(ba.y>fy-10){ba.y=fy-10;ba.vy*=-.3;ba.vx*=.8}
      for(const b of B){if(ba.x+10>b.x&&ba.x-10<b.x+bw&&ba.y+10>b.y&&ba.y-10<b.y+bh){if(!b.dyn||Math.abs(b.vx)<50){b.dyn=true;b.vx=ba.vx*rnd(.4,.8);b.vy=ba.vy*.5-rnd(50,250)*P.spread;b.w=rnd(-8,8)*P.spread;ba.vx*=.82}}}}
    balls=balls.filter(b=>b.x<c.W+40&&Math.abs(b.vx)>5);
    for(const b of B){if(!b.dyn&&!sup(b)){b.dyn=true;b.vx=rnd(-60,120)*P.spread;b.w=rnd(-4,4)*P.spread}}
    for(const b of B){if(!b.dyn||b.rest)continue;b.vy+=P.g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
      if(b.y+bh>=fy){b.y=fy-bh;b.vy*=-.25;b.vx*=.6;b.w*=.5;b.a=lerp(b.a,Math.round(b.a/(Math.PI/2))*(Math.PI/2),.3);if(Math.abs(b.vy)<30&&Math.abs(b.vx)<15){b.rest=true;b.vy=0}}}
    g.clearRect(0,0,c.W,c.H);g.fillStyle='#e4dccd';g.fillRect(0,fy,c.W,c.H-fy);g.fillStyle='#cfc5b2';g.fillRect(0,fy,c.W,2);
    g.fillStyle='#2b2d33';g.beginPath();g.arc(56,fy-12,14,0,TAU);g.fill();g.save();g.translate(56,fy-22);g.rotate(-0.12);g.fillRect(0,-7,34,14);g.restore();
    for(const b of B){g.save();g.translate(b.x+bw/2,b.y+bh/2);g.rotate(b.a);g.fillStyle='#c4573b';g.fillRect(-bw/2+1,-bh/2+1,bw-2,bh-2);g.fillStyle='rgba(255,255,255,.15)';g.fillRect(-bw/2+1,-bh/2+1,bw-2,3);g.restore()}
    g.fillStyle='#17171a';for(const ba of balls){g.beginPath();g.arc(ba.x,ba.y,9,0,TAU);g.fill()}})}});

def({n:74,cat:'O',title:'빛 번짐',hint:'커서 올리기',dark:true,bg:'#111216',
params:[['rad','빛 반경',50,500,10,220,'px'],['amt','안쪽 밝기',0,1,0.05,0.3,''],['edge','테두리 빛',0,1,0.05,0.8,''],['hue','빛 색상',0,360,5,30,'°']],
spec:P=>`어두운 타일 위로 커서를 옮기면 커서를 중심으로 반경 {${P.rad}px}의 색상 {${P.hue}°} 빛이 번진다. 타일 안쪽은 {${P.amt}} 세기로 밝아지고, 빛이 닿은 타일 테두리는 {${P.edge}} 세기로 빛난다.`,
mount(st,P,api){const grid=h('div',null,null,st);grid.style.cssText='position:absolute;inset:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px';
  const T=['빛','Hover','번짐','Glow','인터랙션','Light'].map(w=>{const t=h('div',null,`<span>${w}</span>`,grid);t.style.cssText='position:relative;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:clamp(18px,3.4vw,28px);color:#e9e7e2;background:#24262c;padding:1px';return t});
  let mx=-999,my=-999;api.on(st,'pointermove',e=>{mx=e.clientX;my=e.clientY});api.on(st,'pointerleave',()=>{mx=my=-9999});
  api.frame(()=>{const c=`hsla(${P.hue},90%,65%,`;T.forEach(t=>{const r=t.getBoundingClientRect(),x=mx-r.left,y=my-r.top;

def({n:75,cat:'O',title:'네온 선',hint:'커서를 위아래로',dark:true,bg:'radial-gradient(ellipse at 50% 40%,#0f2a4a,#060b16)',
params:[['lines','선 개수',1,8,1,4,'개'],['amp','최대 진폭',10,150,5,70,'px'],['speed','흐름 속도',0,5,0.1,1.2,''],['glow','빛 번짐',0,40,1,18,'px'],['hue','네온 색상',0,360,5,195,'°']],
spec:P=>`{${P.lines}개}의 색상 {${P.hue}°} 네온 곡선이 {${P.speed}} 속도로 흐른다. 커서가 위로 갈수록 진폭이 최대 {${P.amp}px}까지 커지고 아래로 갈수록 잔잔해진다. 각 선은 {${P.glow}px} 빛 번짐을 두른다.`,
mount(st,P,api){const c=api.canvas();h('div','tip','커서를 위아래로 움직여 보세요',st).style.color='#9fc3ff';let k=.5,tk=.5;api.on(st,'pointermove',e=>{const p=api.pt(e);tk=1-p.y/p.h});
  api.frame(t=>{const g=c.ctx;k=lerp(k,tk,.06);g.clearRect(0,0,c.W,c.H);g.globalCompositeOperation='lighter';
    for(let i=0;i<P.lines;i++){g.beginPath();const ph=i*1.3,f=1+i*.35;for(let x=0;x<=c.W;x+=6){const y=c.H/2+Math.sin(x/c.W*TAU*f+t*P.speed*(1+i*.2)+ph)*P.amp*k*(.5+.5*Math.sin(x/c.W*Math.PI))+Math.sin(x*.013+t+i)*8;x?g.lineTo(x,y):g.moveTo(x,y)}
      g.shadowBlur=P.glow;g.shadowColor=`hsl(${P.hue+i*8},100%,60%)`;g.strokeStyle=`hsla(${P.hue+i*8},100%,${70+i*3}%,.9)`;g.lineWidth=2;g.stroke();g.shadowBlur=0;g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=.8;g.stroke()}g.globalCompositeOperation='source-over'})}});

def({n:76,cat:'O',title:'유리 굴절',hint:'커서 움직이기',
params:[['zoom','배율',1,3,0.05,1.4,'배'],['size','구슬 지름',40,220,5,110,'px'],['follow','따라오는 속도',0.03,1,0.01,0.14,''],['angle','줄무늬 각도',0,180,5,45,'°']],
spec:P=>`{${P.angle}°} 기울어진 색 줄무늬 위에 지름 {${P.size}px}의 유리 구슬이 {${P.follow}}의 속도로 커서를 따라다닌다. 구슬 속 줄무늬는 {${P.zoom}배} 확대되고 가장자리로 갈수록 휘어 보이며, 위쪽에 반사광이 맺힌다.`,
mount(st,P,api){const c=api.canvas();const COL=['#e0573a','#f2f0ea','#2f9b8a','#f2f0ea','#efb63a','#f2f0ea','#273a6e','#f2f0ea'];let x=0,y=0,tx=0,ty=0,init=0;
  api.on(st,'pointermove',e=>{const p=api.pt(e);tx=p.x;ty=p.y});
  const stripes=(g,W,H)=>{g.save();g.translate(W/2,H/2);g.rotate(P.angle*Math.PI/180);const s=26,R=Math.hypot(W,H);for(let i=-R/s;i<R/s;i++){g.fillStyle=COL[((i%8)+8)%8|0];g.fillRect(i*s,-R,s+.5,R*2)}g.restore()};
  const tip=h('div','tip','',st);tip.style.cssText+=';background:rgba(0,0,0,.55);color:#fff;left:12px;right:auto;bottom:12px;padding:4px 10px;border-radius:8px;opacity:1';
  api.frame(()=>{const g=c.ctx,W=c.W,H=c.H;if(!init){init=1;x=tx=W/2;y=ty=H/2}x=lerp(x,tx,P.follow);y=lerp(y,ty,P.follow);stripes(g,W,H);const r=P.size/2;
    g.save();g.beginPath();g.arc(x,y,r,0,TAU);g.clip();const n=6;for(let i=n;i>=1;i--){const rr=r*i/n,z=lerp(P.zoom*1.25,P.zoom*.85,i/n);g.save();g.beginPath();g.arc(x,y,rr,0,TAU);g.clip();g.translate(x,y);g.scale(z,z);g.translate(-x,-y);stripes(g,W,H);g.restore()}
    const gr=g.createRadialGradient(x-r*.3,y-r*.4,r*.05,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.35,'rgba(255,255,255,.05)');gr.addColorStop(.85,'rgba(0,0,0,.05)');gr.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();
    g.beginPath();g.ellipse(x,y+r+8,r*.8,6,0,0,TAU);g.fillStyle='rgba(0,0,0,.15)';g.fill();tip.textContent=`커서를 움직여 보세요 · 구슬 배율 ${P.zoom}배`})}});

def({n:77,cat:'O',title:'크롬 광택',hint:'커서를 좌우로',dark:true,bg:'radial-gradient(ellipse at 50% 30%,#3a3d44,#111215)',
params:[['bands','반사 띠 개수',2,8,1,4,'개'],['contrast','명암 대비',0.2,1,0.05,0.85,''],['shift','반사 이동량',0,200,5,100,'%'],['tilt','입체 기울기',0,35,1,14,'°']],
spec:P=>`커서를 좌우로 움직이면 "CHROME" 글자와 금속 구슬 표면의 {${P.bands}개} 반사 띠가 커서 이동량의 {${P.shift}%}만큼 미끄러지고, 글자는 최대 {${P.tilt}°} 돌아간다. 밝고 어두운 띠의 대비는 {${P.contrast}}.`,
mount(st,P,api){st.style.display='flex';st.style.alignItems='center';st.style.justifyContent='center';st.style.gap='4%';st.style.perspective='700px';

def({n:78,cat:'O',title:'잉크 얼룩 번짐',hint:'화면 누르기',bg:'#f2ede2',

spec:P=>`종이를 누른 자리에서 반지름 약 {${P.size}px}의 잉크 얼룩이 {${P.speed}배} 속도로 천천히 번져 나간다. 가장자리는 {${P.rough}}만큼 울퉁불퉁하고, 주변에 작은 방울 {${P.drops}개}가 튄다. 겹친 얼룩은 더 진해진다.`,

  const blot=(x,y,R,col)=>{const n=72,ph=Array.from({length:4},()=>rnd(0,TAU));B.push({x,y,R,col,n,t:0,shape:Array.from({length:n},(_,i)=>{const a=i/n*TAU;return 1+P.rough*(.25*Math.sin(a*3+ph[0])+.15*Math.sin(a*7+ph[1])+.1*Math.sin(a*13+ph[2])+rnd(-.08,.08))})});if(B.length>40)B.shift()};

def({n:79,cat:'O',title:'연기와 불꽃',hint:'커서를 불 가까이',dark:true,bg:'linear-gradient(#08080c,#141218)',
params:[['base','기본 불 세기',0,1,0.05,0.4,''],['react','반응 거리',50,400,10,200,'px'],['smoke','연기 양',0,1,0.05,0.5,''],['wind','바람',-1,1,0.05,0,'']],
spec:P=>`장작불이 평소엔 {${P.base}} 세기로 타다가, 커서가 불에서 {${P.react}px} 안으로 들어오면 가까울수록 불꽃이 커지고 많아진다. 불꽃 위로 {${P.smoke}}만큼 연기가 피어오르고, 바람 {${P.wind}}만큼 옆으로 휜다.`,
mount(st,P,api){const c=api.canvas();const F=[],S=[];let mx=-999,my=-999,k=0;h('div',null,'불 가까이 가져가 보세요',st).style.cssText='position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.5';
  api.on(st,'pointermove',e=>{const p=api.pt(e);mx=p.x;my=p.y});api.on(st,'pointerleave',()=>{mx=my=-999});
  api.frame((t,dt)=>{const g=c.ctx,cx=c.W/2,cy=c.H-70;const d=Math.hypot(mx-cx,my-cy+40);k=lerp(k,clamp(P.base+(1-d/P.react)*.9,P.base,1.4),.06);
    for(let i=0;i<k*14;i++)F.push({x:cx+rnd(-24,24)*(.6+k*.4),y:cy,vx:rnd(-12,12),vy:-rnd(60,150)*(.6+k),life:1,s:rnd(10,22)*(.6+k*.6)});
    if(Math.random()<P.smoke*.6)S.push({x:cx+rnd(-10,10),y:cy-60*k-20,vx:rnd(-6,6),vy:-rnd(20,40),life:1,s:rnd(10,20)});
    g.clearRect(0,0,c.W,c.H);const gl=g.createRadialGradient(cx,cy,10,cx,cy,180*(.5+k));gl.addColorStop(0,`rgba(255,120,40,${.25*k})`);gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,c.W,c.H);
    for(let i=S.length-1;i>=0;i--){const p=S[i];p.vx+=P.wind*30*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=14*dt;p.life-=dt*.35;if(p.life<=0){S.splice(i,1);continue}g.fillStyle=`rgba(120,115,125,${p.life*.18})`;g.beginPath();g.arc(p.x,p.y,p.s,0,TAU);g.fill()}
    g.globalCompositeOperation='lighter';for(let i=F.length-1;i>=0;i--){const p=F[i];p.vx+=(cx-p.x)*1.2*dt+P.wind*120*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.6;if(p.life<=0){F.splice(i,1);continue}
      const r=p.s*p.life,hue=lerp(10,48,p.life);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,`hsla(${hue},100%,${55+p.life*25}%,${p.life*.55})`);gr.addColorStop(1,'hsla(10,100%,40%,0)');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r,0,TAU);g.fill()}
    g.globalCompositeOperation='source-over';g.fillStyle='#5a3a26';g.save();g.translate(cx,cy+14);[-.25,.25,0].forEach((a,i)=>{g.save();g.rotate(a);g.fillStyle=i==2?'#6b4630':'#4f3322';g.fillRect(-60,-7,120,14);g.fillStyle='#b8834e';g.beginPath();g.arc(60,0,7,0,TAU);g.fill();g.restore()});g.restore()})}});

def({n:80,cat:'O',title:'하늘 색이 바뀌는 하루',hint:'스크롤해 보기',
params:[['arc','해 궤도 높이',0.2,1,0.05,0.7,''],['win','밤 창문 불빛',0,1,0.05,0.6,''],['stars','별 개수',0,200,5,80,'개',{r:1}],['sat','하늘 채도',0.3,1.5,0.05,1,'배']],
spec:P=>`스크롤에 따라 새벽 → 한낮 → 노을 → 밤으로 하늘 색이 바뀐다(채도 {${P.sat}배}). 해는 높이 {${P.arc}}의 호를 그리며 지고, 밤이 되면 별 {${P.stars}개}가 나타나며 건물 창문의 {${Math.round(P.win*100)}%}에 불이 켜진다.`,
mount(st,P,api){const s=api.scroll(5,'스크롤해 보세요');const c=api.canvas(s.view);
  const K=[[0,'#2b3566','#e89a7b'],[.25,'#5fa8e8','#cfe8f7'],[.55,'#5f8fd6','#bfe0f2'],[.72,'#d9714a','#f4b46a'],[.86,'#3b2a55','#a35b6a'],[1,'#0b1028','#1f2650']];
  const hx=s=>s.match(/\w\w/g).map(x=>parseInt(x,16));const at=(p,j)=>{let i=0;while(i<K.length-2&&p>K[i+1][0])i++;const a=K[i],b=K[i+1],t=clamp((p-a[0])/(b[0]-a[0]),0,1);return hx(a[j]).map((v,q)=>lerp(v,hx(b[j])[q],t))};
  const ST=Array.from({length:P.stars},()=>[Math.random(),Math.random()*.6,rnd(.5,1.6)]);const BL=Array.from({length:12},(_,i)=>({w:rnd(.06,.11),h:rnd(.18,.5),win:Array.from({length:40},()=>Math.random())}));
  const sat=([r,g,b])=>{const m=(r+g+b)/3;return[r,g,b].map(v=>clamp(m+(v-m)*P.sat,0,255)|0)};
  api.frame(t=>{const g=c.ctx,W=c.W,H=c.H,p=s.p();const top=sat(at(p,1)),bot=sat(at(p,2));const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgb(${top})`);gr.addColorStop(1,`rgb(${bot})`);g.fillStyle=gr;g.fillRect(0,0,W,H);
    const night=clamp((p-.72)/.2,0,1);for(const [x,y,r] of ST){g.fillStyle=`rgba(255,255,240,${night*(.5+.5*Math.sin(t*2+x*50))})`;g.fillRect(x*W,y*H,r,r)}
    const sa=lerp(-.05,1.05,clamp(p/.9,0,1))*Math.PI,sx=W/2-Math.cos(sa)*W*.42,sy=H*.92-Math.sin(sa)*H*.8*P.arc;g.fillStyle=`rgba(255,${lerp(200,240,Math.sin(sa))|0},${lerp(120,200,Math.sin(sa))|0},.95)`;g.beginPath();g.arc(sx,sy,24,0,TAU);g.fill();
    if(night>0){g.fillStyle=`rgba(240,240,255,${night})`;g.beginPath();g.arc(W*.8,H*.18,14,0,TAU);g.fill()}
    let x=0;BL.forEach((b,i)=>{const bw=b.w*W,bh=b.h*H;const shade=lerp(110,30,clamp(Math.abs(p-.4)*2.2,0,1));g.fillStyle=`rgb(${shade*.8|0},${shade*.7|0},${shade*.9|0})`;g.fillRect(x,H-bh,bw,bh);
      let q=0;for(let yy=H-bh+10;yy<H-8;yy+=14)for(let xx=x+6;xx<x+bw-8;xx+=12){const on=b.win[q++%40]<P.win*night;g.fillStyle=on?'rgba(255,214,120,.95)':'rgba(255,255,255,.08)';g.fillRect(xx,yy,6,8)}x+=bw+2;if(x>W)return})})}});

def({n:81,cat:'P',title:'무한 줌',hint:'스크롤해 보기',

spec:P=>`스크롤하면 전시실 벽의 액자 안으로 계속 들어간다. 액자 속에는 같은 전시실이 화면의 {${P.ratio}배} 크기로 들어 있어, 스크롤 전체 동안 {${P.levels}겹}을 지나며 끝없이 확대되는 것처럼 보인다. 겹마다 {${P.turn}°}씩 돌아가 있다.`,
mount(st,P,api){const s=api.scroll(6,null);const v=s.view;v.style.background='#1a1a1c';

def({n:82,cat:'P',title:'빛줄기 터널 비행',hint:'꾹 누르고 있기',dark:true,bg:'#05060b',

mount(st,P,api){const c=api.canvas();st.style.cursor='pointer';h('div','tip','꾹 누르고 있어 보세요',st).style.color='#9fb2ff';
  const S=Array.from({length:P.count},()=>({x:rnd(-1,1),y:rnd(-1,1),z:rnd(.05,1)}));let sp=P.base,down=false;
  api.on(st,'pointerdown',e=>{down=true;st.setPointerCapture(e.pointerId)});api.on(st,'pointerup',()=>down=false);api.on(st,'pointercancel',()=>down=false);
  api.frame((t,dt)=>{const g=c.ctx,W=c.W,H=c.H,cx=W/2,cy=H/2,f=Math.max(W,H)*.5;sp=lerp(sp,down?P.warp:P.base,1-Math.exp(-P.acc*dt*(down?1:.6)));
    g.fillStyle=`rgba(5,6,11,${clamp(.9-sp*.04,.35,.9)})`;g.fillRect(0,0,W,H);g.lineCap='round';
    for(const o of S){const pz=o.z;o.z-=sp*dt*.4;if(o.z<=.02){o.x=rnd(-1,1);o.y=rnd(-1,1);o.z=1;continue}
      const x1=cx+o.x/pz*f*.5,y1=cy+o.y/pz*f*.5,x2=cx+o.x/o.z*f*.5,y2=cy+o.y/o.z*f*.5;const b=1-o.z;
      g.strokeStyle=`hsla(${P.hue+o.x*30},90%,${60+b*35}%,${b})`;g.lineWidth=b*2.2;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}})}});

def({n:83,cat:'P',title:'물체 회전 전시',hint:'드래그',bg:'radial-gradient(ellipse at 50% 35%,#fbfaf7,#dcd8cf)',

  const cap=h('div',null,null,obj);cap.style.cssText=`position:absolute;width:${R*2}px;height:${R*2}px;left:${-R}px;top:${-R}px;border-radius:50%;background:radial-gradient(#4a4c52,#26272b);transform:translateY(${-Hh/2-10}px) rotateX(90deg)`;
  const base=h('div',null,null,obj);base.style.cssText=`position:absolute;width:${R*2+16}px;height:${R*2+16}px;left:${-R-8}px;top:${-R-8}px;border-radius:50%;background:#f4f1ea;box-shadow:inset 0 0 0 2px #ddd8cc;transform:translateY(${Hh/2-8}px) rotateX(90deg)`;
  const sh=h('div',null,null,st);sh.style.cssText='position:absolute;left:50%;top:50%;width:200px;height:26px;margin:96px 0 0 -100px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.25),transparent 70%)';h('div','tip','드래그해 보세요',st);

    const w=rnd(70,150),hh=rnd(50,120),a=i/P.pieces*TAU+rnd(-.3,.3);e.style.cssText=`position:absolute;left:${50+Math.cos(a)*rnd(22,40)}%;top:${48+Math.sin(a)*rnd(20,36)}%;width:${w}px;height:${hh}px;margin:${-hh/2}px 0 0 ${-w/2}px;background:${C[i%C.length]};clip-path:${torn(P.jag)};filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))`;
    return{e,a,r:rnd(-1,1)}});
  api.frame(()=>{const p=s.p(),n=E.length;E.forEach((o,i)=>{const t=clamp((p*1.25-i/n)*n/2.2,0,1),e=backOut(1.2)(t),d=P.from*(1-e);o.e.style.transform=`translate(${Math.cos(o.a)*d}px,${Math.sin(o.a)*d}px) rotate(${o.r*P.rot*(1+(1-e)*2)}deg) scale(${lerp(1.3,1,e)})`;o.e.style.opacity=t>0?1:0})})}});

def({n:95,cat:'S',title:'픽셀 캐릭터 반복 동작',hint:'화면 누르기',dark:true,bg:'linear-gradient(#1b1640 0 60%,#2c2560 60% 72%,#2f5a2a 72%)',
params:[['fps','프레임 속도',2,24,1,6,'fps'],['px','픽셀 크기',3,12,1,7,'px'],['sparks','마법 입자',0,60,1,22,'개'],['cast','마법 지속',0.3,3,0.1,1.2,'초']],
spec:P=>`밤 들판에 선 픽셀 마법사가 {${P.fps}fps}로 두 프레임을 번갈아 숨 쉬듯 들썩인다. 화면을 누르면 지팡이를 치켜드는 프레임으로 바뀌어 {${P.cast}초} 동안 픽셀 입자 {${P.sparks}개}가 지팡이 끝에서 튄다. 픽셀 하나는 {${P.px}px}.`,
mount(st,P,api){const c=api.canvas();st.style.cursor='pointer';h('div','tip','화면을 눌러 보세요',st);
  const pal={'.':null,'h':'#6a4ac4','H':'#8a6ae0','y':'#f5d76e','s':'#f2c9a0','w':'#f4f4f4','b':'#3e5bd6','B':'#2c43a8','k':'#2a1c12','o':'#7a4a24','g':'#ffd23a','e':'#222'};
  const base=['......hh........','.....hHHh.......','....hHHHHh......','...hHyHHHHh.....','..hhhhhhhhhh....','....ssssss......','....sesses......','....ssssss......','...wwwwwwww.....','...bwwwwwwb.....','..bbbwwwwbbb....','..bBbbbbbbBb....','..bBbbbbbbBb....','..bbbbbbbbbb....','...kk....kk.....','..kkk....kkk....'];
  const staffA=[[11,6,'g'],[11,7,'o'],[11,8,'o'],[11,9,'o'],[11,10,'o'],[11,11,'o'],[11,12,'o'],[11,13,'o']],staffB=[[12,1,'g'],[12,2,'o'],[12,3,'o'],[12,4,'o'],[12,5,'o'],[12,6,'o'],[12,7,'o'],[11,8,'s']];
  const stars=Array.from({length:30},()=>[Math.random(),Math.random()*.55,Math.random()]);let f=0,acc=0,castT=-9,S=[];
  api.on(st,'pointerdown',()=>{castT=performance.now()/1000});
  api.frame((t,dt)=>{const g=c.ctx,W=c.W,H=c.H,ps=P.px;acc+=dt;if(acc>1/P.fps){acc=0;f^=1}const casting=t-castT<P.cast;g.clearRect(0,0,W,H);
    for(const [x,y,k] of stars){g.fillStyle=`rgba(255,255,230,${.4+.6*Math.abs(Math.sin(t*2+k*9))})`;g.fillRect((x*W)|0,(y*H)|0,3,3)}g.fillStyle='#f5e7a8';g.beginPath();g.arc(W*.8,H*.16,14,0,TAU);g.fill();g.fillStyle='#1b1640';g.beginPath();g.arc(W*.8+7,H*.16-4,13,0,TAU);g.fill();
    const ox=Math.round(W/2-8*ps),oy=Math.round(H*.72-16*ps+(f&&!casting?ps:0));const draw=(x,y,col)=>{g.fillStyle=col;g.fillRect(ox+x*ps,oy+y*ps,ps,ps)};
    base.forEach((row,y)=>[...row].forEach((ch,x)=>{const col=pal[ch];if(col)draw(x,y,col)}));(casting?staffB:staffA).forEach(([x,y,k])=>draw(x,y,pal[k]));
    if(casting&&Math.random()<P.sparks*dt*3)for(let i=0;i<3;i++)S.push({x:ox+12.5*ps,y:oy+1.5*ps,vx:rnd(-120,120),vy:rnd(-160,20),l:1,c:['#ffd23a','#fff','#9ad7ff','#ff8fd1'][i]});
    S=S.filter(p=>(p.l-=dt*1.3)>0);for(const p of S){p.vy+=200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.fillStyle=p.c;g.globalAlpha=p.l;const q=Math.max(2,ps*.6|0);g.fillRect(Math.round(p.x/q)*q,Math.round(p.y/q)*q,q,q)}g.globalAlpha=1;
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(ox+2*ps,Math.round(H*.72),11*ps,ps*.6)})}});

def({n:96,cat:'S',title:'만화경 무늬',hint:'커서 움직이기',dark:true,bg:'#151320',
params:[['seg','거울 조각 수',4,16,2,8,'조각'],['speed','회전 속도',0,2,0.05,0.3,''],['shapes','무늬 개수',3,20,1,8,'개'],['hue','색 이동',0,360,5,0,'°']],
spec:P=>`원 안의 무늬가 {${P.seg}조각}의 거울로 반사되어 대칭 만화경을 이룬다. 무늬는 {${P.shapes}개}의 도형으로 커서 위치에 따라 모양과 거리가 바뀌고, 전체가 {${P.speed}} 속도로 천천히 돈다. 색은 {${P.hue}°}만큼 옮겨 쓴다.`,
mount(st,P,api){const c=api.canvas();h('div','tip','커서를 움직여 보세요',st).style.color='#cbbfff';let mx=.5,my=.5,tx=.5,ty=.5;api.on(st,'pointermove',e=>{const p=api.pt(e);tx=p.x/p.w;ty=p.y/p.h});
  const COL=['#ef6a45','#f5c76b','#2fb39a','#7d6cff','#ff8fb1','#f3f1ec'];
  api.frame(t=>{const g=c.ctx,W=c.W,H=c.H,R=Math.min(W,H)*.44,n=P.seg,a=TAU/n;mx=lerp(mx,tx,.06);my=lerp(my,ty,.06);g.clearRect(0,0,W,H);
    g.save();g.translate(W/2,H/2);g.rotate(t*P.speed);
    for(let i=0;i<n;i++){g.save();g.rotate(i*a);if(i%2)g.scale(1,-1);g.beginPath();g.moveTo(0,0);g.arc(0,0,R,-a/2,a/2);g.closePath();g.clip();
      for(let k=0;k<P.shapes;k++){const d=R*(.12+k/P.shapes*.85),off=Math.sin(t*.7+k+mx*4)*a*.35,sz=R*.06*(1+my*2)*(1+Math.sin(k*1.7));g.fillStyle=COL[k%COL.length];g.save();g.rotate(off);g.translate(d,0);g.rotate(t+k);g.filter=`hue-rotate(${P.hue}deg)`;
        g.beginPath();if(k%3==0)g.arc(0,0,sz,0,TAU);else if(k%3==1){g.moveTo(0,-sz);g.lineTo(sz,sz);g.lineTo(-sz,sz);g.closePath()}else g.rect(-sz*.6,-sz*1.4,sz*1.2,sz*2.8);g.fill();g.restore()}g.filter='none';g.restore()}
    g.restore();g.strokeStyle='#3a3460';g.lineWidth=6;g.beginPath();g.arc(W/2,H/2,R+4,0,TAU);g.stroke();g.fillStyle='#f3f1ec';g.beginPath();g.arc(W/2,H/2,R*.07,0,TAU);g.fill()})}});

def({n:97,cat:'S',title:'소리 막대 반응',hint:'샘플 음악 · 내 음악 파일 · 마이크',dark:true,bg:'#141519',
params:[['bars','막대 수',16,128,4,48,'개'],['smooth','부드러움',0,0.95,0.05,0.8,''],['gain','높이 배율',0.5,3,0.1,1.2,'배'],['style','모양',0,1,1,0,'',{L:['가로 막대','원형']}]],
spec:P=>`소리를 고르면(샘플 음악·내 음악 파일·마이크) 주파수를 {${P.bars}개} 막대로 나눠 {${['가로 막대','원형'][P.style]}} 모양으로 보여 준다. 각 막대는 그 대역의 소리 크기에 {${P.gain}배}를 곱한 높이로 오르내리고, 부드러움 {${P.smooth}}로 출렁임이 다듬어진다. 소리가 없으면 한 줄 점선으로 쉰다.`,
mount(st,P,api){const c=api.canvas();let ac=null,an=null,src=null,data=null,mode='',seq=null,el=null;
  const bar=h('div',null,`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button data-m="sample">샘플 음악 듣기</button><button data-m="file">내 음악 파일 열기</button><button data-m="mic">마이크 켜기</button></div><div class="msg" style="margin-top:8px;font-size:12px;opacity:.7">소리 하나를 골라 들어 보세요.</div><input type="file" accept="audio/*" hidden>`,st);
  bar.style.cssText='position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:3';bar.querySelectorAll('button').forEach(b=>b.style.cssText='border:1px solid #5aa9ff;background:rgba(90,169,255,.08);color:#bfe0ff;border-radius:999px;padding:8px 14px;font:600 13px "Noto Sans KR";cursor:pointer');
  const msg=bar.querySelector('.msg'),inp=bar.querySelector('input');
  const ensure=async()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();if(!an){an=ac.createAnalyser();an.fftSize=512;data=new Uint8Array(an.frequencyBinCount)}};
  const stop=()=>{try{seq&&clearInterval(seq);seq=null;src&&src.disconnect();if(el){el.pause();el=null}if(src&&src.mediaStream)src.mediaStream.getTracks().forEach(t=>t.stop())}catch(e){}src=null;mode=''};
  api.clean(()=>{stop();try{ac&&ac.close()}catch(e){}});
  const sample=()=>{const out=ac.createGain();out.gain.value=.25;out.connect(an);an.connect(ac.destination);src=out;const notes=[220,277.2,329.6,440,329.6,277.2,246.9,329.6];let i=0;
    const play=()=>{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),o2=ac.createOscillator(),g2=ac.createGain();o.type='triangle';o.frequency.value=notes[i%8]*(i%16<8?1:1.122);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(out);o.start(t);o.stop(t+.5);
      if(i%2==0){o2.frequency.setValueAtTime(110,t);o2.frequency.exponentialRampToValueAtTime(45,t+.2);g2.gain.setValueAtTime(.9,t);g2.gain.exponentialRampToValueAtTime(.001,t+.3);o2.connect(g2).connect(out);o2.start(t);o2.stop(t+.3)}i++};play();seq=setInterval(play,250)};
  api.on(bar,'click',async e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m)return;if(m==='file'){inp.click();return}stop();
    try{await ensure();if(m==='sample'){sample();mode='sample';msg.textContent='샘플 음악 재생 중 · 다시 누르면 처음부터'}
      else{const s=await navigator.mediaDevices.getUserMedia({audio:true});src=ac.createMediaStreamSource(s);src.mediaStream=s;try{an.disconnect()}catch(_){}src.connect(an);mode='mic';msg.textContent='마이크 듣는 중'}}
    catch(err){msg.textContent=m==='mic'?'이 화면에서는 마이크를 쓸 수 없어요. 샘플 음악이나 내 음악 파일로 들어 보세요.':'소리를 켤 수 없었어요. 한 번 더 눌러 보세요.'}});
  api.on(inp,'change',async()=>{const f=inp.files[0];if(!f)return;stop();try{await ensure();el=new Audio(URL.createObjectURL(f));el.loop=true;src=ac.createMediaElementSource(el);src.connect(an);an.connect(ac.destination);await el.play();mode='file';msg.textContent='재생 중: '+f.name}catch(err){msg.textContent='이 파일은 재생할 수 없어요.'}});
  let vals=new Float32Array(128);
  api.frame(t=>{const g=c.ctx,W=c.W,H=c.H,n=P.bars;if(an){an.smoothingTimeConstant=P.smooth;an.getByteFrequencyData(data)}g.clearRect(0,0,W,H);
    for(let i=0;i<n;i++){const k=Math.floor(Math.pow(i/n,1.6)*(data?data.length*.7:1));const raw=mode&&data?data[k]/255:0;vals[i]=lerp(raw,vals[i],P.smooth*.6)}
    const cy=H*.42;g.lineCap='round';
    if(!mode){g.strokeStyle='#5aa9ff';g.setLineDash([8,6]);g.lineWidth=2;g.beginPath();g.moveTo(W*.08,cy);g.lineTo(W*.92,cy);g.stroke();g.setLineDash([]);return}
    if(P.style==0){const bw=(W*.84)/n;for(let i=0;i<n;i++){const v=Math.min(1,vals[i]*P.gain),hh=Math.max(2,v*H*.34);g.fillStyle=`hsl(${200+i/n*120},90%,${55+v*20}%)`;g.fillRect(W*.08+i*bw+1,cy-hh,bw-2,hh*2)}}
    else{const R=Math.min(W,H)*.16;for(let i=0;i<n;i++){const a=i/n*TAU-Math.PI/2,v=Math.min(1,vals[i]*P.gain),L=R+v*R*1.3;g.strokeStyle=`hsl(${200+i/n*120},90%,60%)`;g.lineWidth=Math.max(2,TAU*R/n*.6);g.beginPath();g.moveTo(W/2+Math.cos(a)*R,cy+Math.sin(a)*R);g.lineTo(W/2+Math.cos(a)*L,cy+Math.sin(a)*L);g.stroke()}}})}});

build();
}
</script>
